<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/utility.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/toast.css">
</head>

<body>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Login Card -->
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Login to continue managing your tasks.</p>
        </div>
        <form id="loginForm" onsubmit="login(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" onblur="validateEmailInput()" oninput="clearEmailError()">
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" onblur="validatePasswordInput()" oninput="clearPasswordError()">
                <small class="error"></small>
            </div>

            <button type="submit" class="auth-btn">
                Login
            </button>
        </form>
        <div class="auth-footer">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>
    </div>


    <script src="../js/login.js"></script>
</body>

</html>
