<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Smart Task Manager</title>
    <link rel="stylesheet" href="../css/utility.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="sidebar">
        sidebar
    </div>
    <div class="main-content">
        <div class="header">
            <h2 class="board-title">Dashboard</h2>
            <div class="header-controls">

            <div class="search-wrapper">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
                </span>
                <input type="text" id="search-board" placeholder="Search tasks, workspaces, notes">
            </div>
            </div>
        </div>
        <div class="statistics">
            <div class="number-statistics">
                <div class="stat-card">
                    <h3 class="stat-heading">Workpaces</h3>
                    <span class="stat-info">12</span>
                    <h3 class="stat-category">Total</h3>
                </div>
                <div class="stat-card">
                    <h3 class="stat-heading">Tasks</h3>
                    <span class="stat-info">12</span>
                    <h3 class="stat-category">Total</h3>
                </div>
                <div class="stat-card">
                    <h3 class="stat-heading">Completed</h3>
                    <span class="stat-info">12</span>
                    <h3 class="stat-category">Tasks</h3>
                </div>
                <div class="stat-card">
                    <h3 class="stat-heading">In Progress</h3>
                    <span class="stat-info">12</span>
                    <h3 class="stat-category">Tasks</h3>
                </div>
                <div class="stat-card">
                    <h3 class="stat-heading">To Do</h3>
                    <span class="stat-info">12</span>
                    <h3 class="stat-category">Tasks</h3>
                </div>
                <div class="stat-card">
                    <h3 class="stat-heading">Overdue</h3>
                    <span class="stat-info">12</span>
                    <h3 class="stat-category">Tasks</h3>
                </div>
            </div>
            <div class="chart-statistics">
                
            </div>
        </div>
    </div>
</body>
</html>
