<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes | Smart Task Manager</title>
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  <link rel="stylesheet" href="../css/utility.css" />
  <link rel="stylesheet" href="../css/notes.css" />
   <link rel="stylesheet" href="../css/sidebar.css" />
</head>

<body>
  <!-- <div class="blur"></div> -->

  <!-- Side bar -->
  <div class="app-sidebar">sidebar</div>

  <!-- content -->
  <div class="section">
    <div class="container">
      <!-- Notes Page Header -->
      <header class="d-flex align-center justify-between">
        <h1>Notes</h1>
        <div class="d-flex align-center gap-4">
          <div class="d-flex align-cente input-box gap-2">
            <span class="icon-container">
              <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true"
                role="img" width="64" height="64" viewBox="0 0 26 26" style="
                    color: rgb(74, 85, 101);
                    opacity: 1;
                    transform: rotate(0deg);
                  ">
                <path fill="currentColor"
                  d="M10 .188A9.81 9.81 0 0 0 .187 10A9.81 9.81 0 0 0 10 19.813c2.29 0 4.393-.811 6.063-2.125l.875.875a1.845 1.845 0 0 0 .343 2.156l4.594 4.625c.713.714 1.88.714 2.594 0l.875-.875a1.84 1.84 0 0 0 0-2.594l-4.625-4.594a1.82 1.82 0 0 0-2.157-.312l-.875-.875A9.812 9.812 0 0 0 10 .188M10 2a8 8 0 1 1 0 16a8 8 0 0 1 0-16M4.937 7.469a5.45 5.45 0 0 0-.812 2.875a5.46 5.46 0 0 0 5.469 5.469a5.5 5.5 0 0 0 3.156-1a7 7 0 0 1-.75.03a7.045 7.045 0 0 1-7.063-7.062c0-.104-.005-.208 0-.312">
                </path>
              </svg>
            </span>
            <input id="search-notes" type="text" placeholder="search notes.." />
          </div>
          <button class="button button-blue d-flex align-center gap-1" type="button" onclick="toggleCreateWindow()">
            <span class="icon-container">
              <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true"
                role="img" width="64" height="64" viewBox="0 0 24 24" style="
                      color: currentColor;
                      opacity: 1;
                      transform: rotate(0deg);
                    ">
                <g fill="none" stroke="currentColor" stroke-dasharray="16" stroke-linecap="round"
                  stroke-linejoin="round" stroke-width="2">
                  <path d="M5 12h14">
                    <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.5s" values="16;0"></animate>
                  </path>
                  <path stroke-dashoffset="16" d="M12 5v14">
                    <animate fill="freeze" attributeName="stroke-dashoffset" begin="0.5s" dur="0.5s" to="0"></animate>
                  </path>
                </g>
              </svg>
            </span>
            Add Notes
          </button>

        </div>
      </header>

      <!--Main Content -->
      <main>
        <div id="notes-box" class="d-grid justify-center align-center gap-3">




        </div>
      </main>

      <!-- Overlay Creating box -->
      <div id="overlay-main-box" class="d-none">
        <div id="note-create-box" >
          <h3>Creating Note</h3>
          <form action="" onsubmit="handleSubmit(event)">
            <div class="d-flex flex-direction">
              <label for="note-header-input"> Note Name : </label>
              <input id="note-header-input" type="text" placeholder="Enter Note Header..." required />
            </div>
            <div class="d-flex flex-direction">
              <label for="note-type">Note Type : </label>
              <select name="note-type" id="note-type" onchange="noteTypeHandler(this)" required>
                <option value="">Select Note Type</option>
                <option value="simple">Simple Note</option>
                <option value="unordered">Unordered Note</option>
                <option value="checkbox">Checkbox Note</option>
              </select>
            </div>

            <div id="note-input-taker" class="d-flex d-none align-center justify-center">
              <textarea name="" id="" placeholder="Enter Note..."></textarea>
            </div>

            <div id="order-item-box" class="d-flex flex-direction d-none">
              <label>Note list : </label>
              <div id="order-item-inputs">


                <div class="d-flex align-center">
                  <input name="inputListitem" type="text" placeholder="Enter Note list..." />
                  <span class="icon-container pointer" onclick="deleteItemList(this)">
                    <img src="../assets/icons/delete-icon.svg" alt="">
                  </span>
                </div>

                <div id="#note-add-item-button" class="d-flex align-center justify-center ">
                  <button type="button" class="button button-blue w-100" onclick="addItemList(this)">
                    Add Item
                  </button>
                </div>
              </div>
            </div>

            <div id="submit-button-box" class="d-flex w-100">
              <button type="submit" class="button button-blue">Save</button>
              <button type="button" class="button button-blue-reverse" onclick="cancelHandler()">cancel</button>
            </div>
          </form>
        </div>
      </div>



    </div>
  </div>
</body>
<script src="../script.js"></script>
<script src="../js/notes.js"></script>

</html>
