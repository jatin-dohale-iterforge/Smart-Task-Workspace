<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Smart Task Manager</title>
    <link rel="stylesheet" href="../css/taskboard.css">
    <link rel="stylesheet" href="../css/utility.css">
</head>

<body>
    <div class="sidebar">
        sidebar
    </div>
    <div class="main-content">
        <div class="header">
            <h2 class="board-title">Task Board</h2>
            <div class="header-controls">
            <div class="dropdown-wrapper">
                <select class="workspace-select">
                    <option value="all">All Workspaces</option>
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                </select>
            </div>

            <div class="search-wrapper">
                <span id="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
                </span>
                <input type="text" id="search-board" placeholder="Tasks" oninput="renderTasks()">
            </div>
            <button class="filter-btn">
                <span class="filter-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-funnel" viewBox="0 0 16 16">
                <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z"/>
                </svg></span> Filters
            </button>

        <a href="#/tasks/create" class="global-add-btn">+ Add Task</a>
            </div>

        </div>
        <div class="task-cards">
            <div class="todo-card">
                <div class="title-flex">
                    <h4 class="card-title">To Do</h4>
                    <span class="task-count">6</span>
                </div>
                <div class="task-banner"></div>
                <a href="#/tasks/create" class="add-task-btn">Add Task +</a>
            </div>
            <div class="inprogress-card">
                <div class="title-flex">
                    <h4 class="card-title">In Progress</h4>
                    <span class="task-count">7</span>
                </div>
                <div class="task-banner"></div>
                <a href="#/tasks/create" class="add-task-btn">Add Task +</a>
            </div>
            <div class="completed-card">
                <div class="title-flex">
                    <h4 class="card-title">Completed</h4>
                    <span class="task-count">1</span>
                </div>
                <div class="task-banner"></div>
                <a href="#/tasks/create" class="add-task-btn">Add Task +</a>
            </div>
            <div class="overdue-card">
                <div class="title-flex">
                    <h4 class="card-title">Overdue</h4>
                    <span class="task-count">6</span>
                </div>
                <div class="task-banner"></div>
                <a href="#/tasks/create" class="add-task-btn">Add Task +</a>
            </div>

        </div>
    </div>

    <!-- MODAL FORM -->
    <div id="task-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="form-title">Create New Task</h3>
                <a href="#/tasks" class="close-modal-btn">✕</a>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">

                <div class="form-group">
                    <label for="task-name">Task Name</label>
                    <input type="text" id="task-name" required placeholder="Enter task name...">
                </div>

                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Enter task description..."></textarea>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="task-type">Status Column</label>
                        <select id="task-type" required>
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="overdue">Overdue</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" required>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-date">Due Date</label>
                    <input type="date" id="task-date" required>
                </div>

                <div class="form-actions">
                    <a href="#/tasks" class="cancel-btn">Cancel</a>
                    <button type="submit" class="save-btn">Save Task</button>
                </div>
            </form>
        </div>

        <script src="../js/taskboard.js"></script>
</body>

</html>
