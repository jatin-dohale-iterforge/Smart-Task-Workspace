<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Smart Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="../css/taskboard.css">
    <link rel="stylesheet" href="../css/utility.css">
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/toast.css">
</head>

<body>

    <!-- Side bar -->
    <div class="app-sidebar">sidebar</div>

    <!-- content -->
    <div class="section">
        <div class="container">

            <!-- Notes Page Header -->
            <div class="header"></div>
            <div class="task-cards">
                <div class="todo-card">
                    <div class="title-flex">
                        <h4 class="card-title">To Do</h4>
                        <span class="task-count">6</span>
                    </div>
                    <div class="task-banner"></div>
                    <a href="#/tasks/create?type=todo" class="add-task-btn">Add Task +</a>
                </div>
                <div class="inprogress-card">
                    <div class="title-flex">
                        <h4 class="card-title">In Progress</h4>
                        <span class="task-count">7</span>
                    </div>
                    <div class="task-banner"></div>
                    <a href="#/tasks/create?type=inprogress" class="add-task-btn">Add Task +</a>
                </div>
                <div class="completed-card">
                    <div class="title-flex">
                        <h4 class="card-title">Completed</h4>
                        <span class="task-count">1</span>
                    </div>
                    <div class="task-banner"></div>
                    <a href="#/tasks/create?type=completed" class="add-task-btn">Add Task +</a>
                </div>
                <div class="overdue-card">
                    <div class="title-flex">
                        <h4 class="card-title">Overdue</h4>
                        <span class="task-count">6</span>
                    </div>
                    <div class="task-banner"></div>
                    <a href="#/tasks/create?type=overdue" class="add-task-btn">Add Task +</a>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL FORM -->
    <div id="task-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="form-title">Create New Task</h3>
                <button type="button" class="close-modal-btn" onclick="closeTaskFormModal()">✕</button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">

                <div class="form-group">
                    <label for="task-name">Task Name</label>
                    <input type="text" id="task-name" required placeholder="Enter task name...">
                </div>

                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Enter task description..."></textarea>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="task-type">Status Column</label>
                        <select id="task-type" required>
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="overdue">Overdue</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" required>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="task-workspace-assign">Assign to Workspace</label>
                    <select id="task-workspace-assign" required></select>
                </div>

                <div class="form-group">
                    <label for="task-assigned-to">
                         Assign Employee
                        </label>
                        <select id="task-assigned-to" required></select>
                    </div>

                <div class="form-group">
                    <label for="task-date">Due Date</label>
                    <input type="date" id="task-date" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeTaskFormModal()">Cancel</button>
                    <button type="submit" class="save-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Bottom Bar -->
    <nav class="mobile-nav">
    </nav>
    <div id="toast" class="toast"></div>
        <script src="../js/config.js"></script>
        <script src="../script.js"></script>
        <script src="../js/taskboard.js"></script>
</body>

</html>
