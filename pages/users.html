<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | Smart Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/utility.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/users.css">
</head>

<body>

    <!-- Side bar -->
    <div class="app-sidebar">
        Sidebar
    </div>

    <main class="section">
      <div class="container">

       <div class="header">
           </button>
       </div>

       <!-- Table Content -->
        <div class="user-list-content">
            <div class="user-table-container">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
      </div>
    </main>


    <!-- Bottom Bar -->
    <nav class="mobile-nav">
    </nav>

    <div id="toast" class="toast"></div>

    <!-- Add / Edit User Form Modal Container Overlay -->
    <div class="delete-modal" id="userModal" style="display: none;">
        <div class="delete-box">
            <h3 id="modalTitle">Add New User</h3>
            <form id="userForm" onsubmit="saveUser(event)">
                <div>
                    <label>Name</label>
                    <input type="text" id="userName" required style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                </div>
                <div style="margin-top: 12px;">
                    <label>Email</label>
                    <input type="email" id="userEmail" required style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                </div>
                <div style="margin-top: 12px;">
                    <label>Role</label>
                    <select id="userRole" required style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                        <option value="employee">employee</option>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="delete-actions" style="margin-top: 22px;">
                    <button type="button" class="cancel-btn" onclick="closeFormModal()">Cancel</button>
                    <button type="submit" class="btn-action" style="background-color: #4CAF50; color: white;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal  -->
    <div class="delete-modal" id="deleteModal" style="display: none;">
        <div class="delete-box">
            <h3>Delete User</h3>
            <p>Are you sure you want to proceed?</p>
            <div class="delete-actions">
                <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-action btn-delete" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
    
    <script src="../js/users.js"></script>
    <script src="../script.js"></script>
</body>

</html>
